[build-system]
requires = ["scikit-build-core>=0.11", "cmake>=3.26", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "seventy"
version = "1.1.3"
description = "Inference engine for Qwen3.5-family models on NVIDIA V100 (sm70) GPUs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.10.0+cu129",
    "numpy==2.5.5",
    "safetensors==0.8.0",
    "tokenizers==0.23.3",
    "huggingface-hub==2.4.0",
    "jinja2==3.1.6",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "pillow==13.0.0",
    "opencv-python-headless==5.1.0.95",
    "nvidia-ml-py==13.615.71",
    "pyzmq==27.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]
reference = ["transformers==5.24.0", "compressed-tensors==0.20.1", "torchvision==0.25.0"]

[project.scripts]
seventy = "seventy.__main__:main"

[tool.scikit-build]
wheel.py-api = "py3"
wheel.packages = ["seventy"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
sdist.include = ["csrc", "CMakeLists.txt"]

[[tool.scikit-build.overrides]]
if.platform-system = "^linux$"
if.platform-machine = "^x86_64$"
wheel.tags = ["py3-none-manylinux_2_28_x86_64"]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU and the kernel library; uses little GPU memory",
    "model: needs the model checkpoint on disk",
    "slow: runs for minutes",
]
